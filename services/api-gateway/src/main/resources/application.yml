server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: customer-service
              uri: ${CUSTOMER_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/customers/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
